# Evaluation set for pypeit-chat (DESIGN Section 13).
#
# Fields:
#   id                 unique id
#   question           the question as a user would ask it
#   origin             where it comes from: "report" (prompts/start_up.md,
#                      section 5), "github#N" (a closed PypeIt issue, rewritten
#                      as a question), "consistency" (seeded from
#                      index/consistency.json) or "handwritten"
#   expected_sources   path prefixes (doc/..., pypeit/...) or chunk-id prefixes
#                      (param:FindObjPar.snr_thresh); a hit is any of them in
#                      the top 10 sources
#   key_facts          strings that should appear in the answer (case-insensitive;
#                      "a|b" means either)
#   both               true if both a docs and a code source should be cited
#   difference         true if the answer should report that docs and code differ
#   off_topic          true if the bot should refuse without calling the model
#
# Only "github#N" questions are real user questions.  DESIGN M2 asks for >= 30;
# grow the set from the PypeIt Users Slack if Open question 7 allows.

